<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RPG Жизнь</title>
    <style>
        * { box-sizing: border-box; }
        html, body {
            height: 100%; overflow: hidden; position: fixed; width: 100%;
            margin: 0; padding: 0; overscroll-behavior: none; touch-action: manipulation;
        }
        body {
            font-family: 'Courier New', monospace;
            color: #7ad7ff;
            display: flex; flex-direction: column; align-items: center;
            user-select: none; background-color: #0a0a1a;
        }
        .grid-bg {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: -2; background-color: #0a0a1a;
            background-image: 
                linear-gradient(rgba(0, 255, 255, 0.08) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 255, 255, 0.08) 1px, transparent 1px);
            background-size: 22px 22px;
        }
        .grid-glow {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: -1;
            background: 
                radial-gradient(ellipse at 0% 0%, rgba(74, 168, 232, 0.12) 0%, transparent 50%),
                radial-gradient(ellipse at 100% 100%, rgba(155, 89, 182, 0.1) 0%, transparent 50%),
                radial-gradient(ellipse at 100% 0%, rgba(0, 255, 255, 0.06) 0%, transparent 50%);
        }

        /* ===== ВЕРХНЯЯ ПАНЕЛЬ ===== */
        .top-bar {
            position: fixed; top: 15px; left: 15px; right: 15px;
            display: flex; align-items: center; gap: 10px; z-index: 100;
        }
        .menu-btn {
            flex-shrink: 0; width: 48px; height: 48px;
            background: rgba(15, 30, 55, 0.9); border: 1px solid #1e4a7a;
            cursor: pointer; display: flex; flex-direction: column;
            align-items: center; justify-content: center; gap: 5px;
            transition: all 0.2s; border-radius: 4px; padding: 0;
        }
        .menu-btn:hover { border-color: #00ffff; box-shadow: 0 0 15px rgba(0, 255, 255, 0.4); }
        .menu-btn:active { transform: scale(0.95); }
        .menu-btn span {
            display: block; width: 22px; height: 2px; background: #7ad7ff;
            border-radius: 1px; transition: all 0.3s;
        }
        .menu-btn:hover span { background: #00ffff; box-shadow: 0 0 6px #00ffff; }
        .menu-btn.open span:nth-child(1) { transform: translateY(7px) rotate(45deg); }
        .menu-btn.open span:nth-child(2) { opacity: 0; }
        .menu-btn.open span:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }

        .badge {
            flex: 1;
            height: 48px;
            background: rgba(15, 30, 55, 0.9);
            border: 1px solid #1e4a7a;
            border-radius: 4px;
            display: flex; align-items: center; justify-content: center;
            padding: 0 12px; gap: 6px;
            transition: all 0.2s; overflow: hidden;
        }
        .badge:hover { border-color: #00ffff; box-shadow: 0 0 15px rgba(0, 255, 255, 0.4); }
        .badge .label { font-size: 11px; color: #4a7a9a; text-transform: uppercase; letter-spacing: 1px; }
        .badge .value {
            font-size: 18px; font-weight: bold; color: #00ffff;
            text-shadow: 0 0 8px rgba(0, 255, 255, 0.7); letter-spacing: 1px;
        }
        .badge .xp-mini { font-size: 10px; color: #4a7a9a; }
        .badge.hidden { display: none; }

        /* ===== ОСНОВНОЙ КОНТЕНТ ===== */
        .page {
            width: 100%; height: 100%; display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            padding: 80px 15px 80px 15px; overflow: hidden;
        }
        .page.hidden { display: none; }

        /* ===== СТАТИСТИКА (растянутая по высоте) ===== */
        .stats-card {
            width: 100%; max-width: 340px;
            height: 60vh;
            max-height: 550px;
            background: rgba(10, 20, 40, 0.8);
            border: 1px solid #00ffff;
            border-radius: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            backdrop-filter: blur(8px);
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.25), inset 0 0 15px rgba(0, 255, 255, 0.08);
            position: relative;
            padding: 20px;
        }
        .stats-card::before, .stats-card::after {
            content: ''; position: absolute; width: 12px; height: 12px;
            border: 2px solid #00ffff; box-shadow: 0 0 8px #00ffff;
        }
        .stats-card::before { top: -2px; left: -2px; border-right: none; border-bottom: none; }
        .stats-card::after { bottom: -2px; right: -2px; border-left: none; border-top: none; }
        
        .stats-title {
            font-size: 20px;
            color: #00ffff;
            letter-spacing: 4px;
            text-transform: uppercase;
            text-shadow: 0 0 10px #00ffff;
            margin-bottom: 20px;
        }
        .stats-empty {
            font-size: 13px;
            color: #4a7a9a;
            letter-spacing: 1px;
            line-height: 1.8;
        }

        /* ===== СИСТЕМА ===== */
        .settings-card {
            width: 100%; max-width: 340px;
            background: rgba(10, 20, 40, 0.8); border: 1px solid #00ffff;
            border-radius: 0; padding: 25px 20px; text-align: center;
            backdrop-filter: blur(8px);
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.25), inset 0 0 15px rgba(0, 255, 255, 0.08);
            position: relative;
        }
        .settings-card::before, .settings-card::after {
            content: ''; position: absolute; width: 12px; height: 12px;
            border: 2px solid #00ffff; box-shadow: 0 0 8px #00ffff;
        }
        .settings-card::before { top: -2px; left: -2px; border-right: none; border-bottom: none; }
        .settings-card::after { bottom: -2px; right: -2px; border-left: none; border-top: none; }

        .settings-label {
            font-size: 12px; color: #4a7a9a; text-transform: uppercase;
            letter-spacing: 2px; margin-bottom: 10px;
        }

        .name-input {
            width: 100%; padding: 14px;
            background: rgba(0, 20, 40, 0.9); border: 1px solid #0088ff;
            color: #00ffff; font-family: 'Courier New', monospace;
            font-size: 18px; font-weight: bold; text-align: center;
            letter-spacing: 1px; outline: none; transition: all 0.2s;
            border-radius: 0; margin-bottom: 12px;
        }
        .name-input:focus { border-color: #00ffff; box-shadow: 0 0 15px rgba(0, 255, 255, 0.5); }
        .name-input::placeholder { color: #3a5a7a; font-weight: normal; }

        .save-name-btn {
            padding: 12px;
            background: rgba(0, 136, 255, 0.2);
            border: 1px solid #0088ff;
            color: #00ffff;
            font-family: 'Courier New', monospace; font-size: 13px; font-weight: bold;
            letter-spacing: 2px; text-transform: uppercase;
            cursor: pointer; transition: all 0.2s;
            border-radius: 0; width: 100%; margin-bottom: 25px;
        }
        .save-name-btn:hover {
            background: rgba(0, 136, 255, 0.4); border-color: #00ffff;
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.5);
        }
        .save-name-btn:active { transform: scale(0.97); }

        .divider {
            width: 100%;
            height: 1px;
            background: #004466;
            margin: 20px 0;
        }

        .action-btn {
            padding: 14px; border: 1px solid #0088ff;
            background: rgba(0, 30, 60, 0.8); color: #00ffff;
            font-family: 'Courier New', monospace; font-size: 14px; font-weight: bold;
            letter-spacing: 1px; cursor: pointer; transition: all 0.2s;
            border-radius: 0; backdrop-filter: blur(8px); width: 100%;
        }
        .action-btn:hover {
            background: rgba(0, 60, 120, 0.9); border-color: #00ffff;
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.5);
        }
        .btn-danger { border-color: #ff0055; color: #ff0055; }
        .btn-danger:hover { border-color: #ff0055; color: #ff0055; box-shadow: 0 0 15px rgba(255, 0, 85, 0.5); }

        .tab-title {
            font-size: 20px; text-transform: uppercase; letter-spacing: 3px;
            color: #00ffff; margin: 0 0 20px 0; text-align: center;
            text-shadow: 0 0 10px #00ffff;
        }
        .placeholder-box {
            width: 100%; max-width: 340px; padding: 30px 20px;
            background: rgba(10, 20, 40, 0.75); border: 1px dashed #004466;
            text-align: center; color: #4a7a9a; font-size: 14px; line-height: 1.7;
            border-radius: 0; backdrop-filter: blur(8px);
        }
        .placeholder-box .big { font-size: 44px; margin-bottom: 12px; opacity: 0.7; }

        /* ===== НИЖНЯЯ ПАНЕЛЬ ===== */
        .bottom-nav {
            position: fixed; bottom: 0; left: 0; right: 0; height: 68px;
            background: rgba(5, 10, 20, 0.97); border-top: 1px solid #00ffff;
            display: flex; justify-content: space-around; align-items: center;
            z-index: 99; backdrop-filter: blur(10px);
            box-shadow: 0 -5px 20px rgba(0, 255, 255, 0.15);
            transition: transform 0.3s ease, opacity 0.3s ease;
        }
        .bottom-nav.hidden { transform: translateY(100%); opacity: 0; pointer-events: none; }
        .nav-item {
            flex: 1; height: 100%; display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            background: transparent; border: none; color: #3a5a7a;
            font-family: 'Courier New', monospace; font-size: 10px;
            text-transform: uppercase; letter-spacing: 1px;
            cursor: pointer; transition: all 0.2s; gap: 4px; position: relative;
        }
        .nav-item .icon { font-size: 24px; line-height: 1; transition: all 0.2s; }
        .nav-item.active { color: #00ffff; text-shadow: 0 0 10px #00ffff; }
        .nav-item.active .icon { text-shadow: 0 0 12px #00ffff; }
        .nav-item.active::before {
            content: ''; position: absolute; top: 0; left: 25%; right: 25%;
            height: 2px; background: #00ffff; box-shadow: 0 0 10px #00ffff;
        }
        .nav-item:hover { color: #00ffff; }
    </style>
</head>
<body>

    <div class="grid-bg"></div>
    <div class="grid-glow"></div>

    <!-- ===== ВЕРХНЯЯ ПАНЕЛЬ ===== -->
    <div class="top-bar">
        <button class="menu-btn" id="menuBtn" onclick="toggleSettings()">
