<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RPG Жизнь</title>
    <style>
        * { box-sizing: border-box; }
        html, body {
            height: 100%; overflow: hidden; position: fixed; width: 100%;
            margin: 0; padding: 0; overscroll-behavior: none; touch-action: manipulation;
        }
        body {
            font-family: 'Courier New', monospace;
            color: #7ad7ff;
            display: flex; flex-direction: column; align-items: center;
            user-select: none; background-color: #0a0a1a;
        }
        .grid-bg {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: -2; background-color: #0a0a1a;
            background-image: 
                linear-gradient(rgba(0, 255, 255, 0.08) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 255, 255, 0.08) 1px, transparent 1px);
            background-size: 22px 22px;
        }
        .grid-glow {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: -1;
            background: 
                radial-gradient(ellipse at 0% 0%, rgba(74, 168, 232, 0.12) 0%, transparent 50%),
                radial-gradient(ellipse at 100% 100%, rgba(155, 89, 182, 0.1) 0%, transparent 50%),
                radial-gradient(ellipse at 100% 0%, rgba(0, 255, 255, 0.06) 0%, transparent 50%);
        }
        .top-bar {
            position: fixed; top: 15px; left: 15px; right: 15px;
            display: flex; align-items: center; gap: 12px; z-index: 100;
        }
        .menu-btn {
            flex-shrink: 0; width: 48px; height: 48px;
            background: rgba(15, 30, 55, 0.9); border: 1px solid #1e4a7a;
            cursor: pointer; display: flex; flex-direction: column;
            align-items: center; justify-content: center; gap: 5px;
            transition: all 0.2s; border-radius: 4px; padding: 0;
        }
        .menu-btn:hover { border-color: #00ffff; box-shadow: 0 0 15px rgba(0, 255, 255, 0.4); }
        .menu-btn:active { transform: scale(0.95); }
        .menu-btn span {
            display: block; width: 22px; height: 2px; background: #7ad7ff;
            border-radius: 1px; transition: all 0.3s;
        }
        .menu-btn:hover span { background: #00ffff; box-shadow: 0 0 6px #00ffff; }
        .menu-btn.open span:nth-child(1) { transform: translateY(7px) rotate(45deg); }
        .menu-btn.open span:nth-child(2) { opacity: 0; }
        .menu-btn.open span:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }
        .level-badge {
            flex: 1; height: 48px; background: rgba(15, 30, 55, 0.9);
            border: 1px solid #1e4a7a; border-radius: 4px;
            display: flex; align-items: center; justify-content: center;
            padding: 0 15px; gap: 8px; transition: all 0.2s; overflow: hidden;
        }
        .level-badge:hover { border-color: #00ffff; box-shadow: 0 0 15px rgba(0, 255, 255, 0.4); }
        .level-badge .label { font-size: 12px; color: #4a7a9a; text-transform: uppercase; letter-spacing: 1px; }
        .level-badge .value {
            font-size: 20px; font-weight: bold; color: #00ffff;
            text-shadow: 0 0 8px rgba(0, 255, 255, 0.7); letter-spacing: 1px;
        }
        .level-badge .xp-mini { font-size: 11px; color: #4a7a9a; margin-left: auto; }
        .level-badge.hidden { display: none; }
        .page {
            width: 100%; height: 100%; display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            padding: 90px 20px 90px 20px; overflow: hidden;
        }
        .page.hidden { display: none; }
        .profile-card {
            width: 100%; max-width: 340px;
            background: rgba(10, 20, 40, 0.8); border: 1px solid #00ffff;
            border-radius: 0; padding: 25px 20px; text-align: center;
            backdrop-filter: blur(8px);
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.25), inset 0 0 15px rgba(0, 255, 255, 0.08);
            position: relative;
        }
        .profile-card::before, .profile-card::after {
            content: ''; position: absolute; width: 12px; height: 12px;
            border: 2px solid #00ffff; box-shadow: 0 0 8px #00ffff;
        }
        .profile-card::before { top: -2px; left: -2px; border-right: none; border-bottom: none; }
        .profile-card::after { bottom: -2px; right: -2px; border-left: none; border-top: none; }
        .avatar-wrapper {
            width: 110px; height: 110px; margin: 0 auto 18px;
            border-radius: 50%; padding: 3px;
            background: linear-gradient(135deg, #0088ff, #00ffff);
            box-shadow: 0 0 25px rgba(0, 255, 255, 0.6);
        }
        .avatar {
            width: 100%; height: 100%; border-radius: 50%;
            object-fit: cover; background: #0a1520; display: block;
        }
        .profile-name {
            font-size: 22px; font-weight: bold; color: #00ffff;
            letter-spacing: 1px; margin-bottom: 5px; text-shadow: 0 0 12px #00ffff;
        }
        .profile-username { font-size: 13px; color: #4a7a9a; margin-bottom: 20px; }
        .profile-level {
            display: inline-block; padding: 8px 20px;
            background: rgba(0, 136, 255, 0.2); border: 1px solid #0088ff;
            border-radius: 0; font-size: 14px; color: #00ffff;
            letter-spacing: 2px; text-transform: uppercase;
            box-shadow: 0 0 10px rgba(0, 255, 255, 0.3);
        }
        .tab-title {
            font-size: 20px; text-transform: uppercase; letter-spacing: 3px;
            color: #00ffff; margin: 0 0 20px 0; text-align: center;
            text-shadow: 0 0 10px #00ffff;
        }
        .placeholder-box {
            width: 100%; max-width: 340px; padding: 30px 20px;
            background: rgba(10, 20, 40, 0.75); border: 1px dashed #004466;
            text-align: center; color: #4a7a9a; font-size: 14px; line-height: 1.7;
            border-radius: 0; backdrop-filter: blur(8px);
        }
        .placeholder-box .big { font-size: 44px; margin-bottom: 12px; opacity: 0.7; }
        .action-btn {
            padding: 14px; border: 1px solid #0088ff;
            background: rgba(0, 30, 60, 0.8); color: #00ffff;
            font-family: 'Courier New', monospace; font-size: 14px; font-weight: bold;
            letter-spacing: 1px; cursor: pointer; transition: all 0.2s;
            border-radius: 0; backdrop-filter: blur(8px); width: 100%;
        }
        .action-btn:hover {
            background: rgba(0, 60, 120, 0.9); border-color: #00ffff;
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.5);
        }
        .bottom-nav {
            position: fixed; bottom: 0; left: 0; right: 0; height: 68px;
            background: rgba(5, 10, 20, 0.97); border-top: 1px solid #00ffff;
            display: flex; justify-content: space-around; align-items: center;
            z-index: 99; backdrop-filter: blur(10px);
            box-shadow: 0 -5px 20px rgba(0, 255, 255, 0.15);
            transition: transform 0.3s ease, opacity 0.3s ease;
        }
        .bottom-nav.hidden { transform: translateY(100%); opacity: 0; pointer-events: none; }
        .nav-item {
            flex: 1; height: 100%; display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            background: transparent; border: none; color: #3a5a7a;
            font-family: 'Courier New', monospace; font-size: 10px;
            text-transform: uppercase; letter-spacing: 1px;
            cursor: pointer; transition: all 0.2s; gap: 4px; position: relative;
        }
        .nav-item .icon { font-size: 24px; line-height: 1; transition: all 0.2s; }
        .nav-item.active { color: #00ffff; text-shadow: 0 0 10px #00ffff; }
        .nav-item.active .icon { text-shadow: 0 0 12px #00ffff; }
        .nav-item.active::before {
            content: ''; position: absolute; top: 0; left: 25%; right: 25%;
            height: 2px; background: #00ffff; box-shadow: 0 0 10px #00ffff;
        }
        .nav-item:hover { color: #00ffff; }
    </style>
</head>
<body>

    <div class="grid-bg"></div>
    <div class="grid-glow"></div>

    <div class="top-bar">
        <button class="menu-btn" id="menuBtn" onclick="toggleSettings()">
            <span></span><span></span><span></span>
        </button>
        <div class="level-badge" id="levelBadge">
            <span class="label">Уровень</span>
            <span class="value" id="topLvl">1</span>
            <span class="xp-mini">(<span id="topXp">0</span>/<span id="topXpMax">100</span>)</span>
        </div>
    </div>

    <div class="page" id="page-home"></div>

    <div class="page hidden" id="page-quests">
        <div class="tab-title">КВЕСТЫ</div>
        <div class="placeholder-box">
            <div class="big">⬡</div>
            Здесь появятся ежедневные задания:<br>
            • 20 отжиманий<br>
            • Прочитать 10 страниц<br>
            • Убрать комнату<br><br>
            Награда — опыт
        </div>
    </div>

    <div class="page hidden" id="page-profile">
        <div class="profile-card">
            <div class="avatar-wrapper">
                <img class="avatar" id="userAvatar" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='110' height='110'><rect width='110' height='110' fill='%230a1520'/><text x='50%' y='50%' font-size='40' fill='%234a7a9a' text-anchor='middle' dominant-baseline='central'>?</text></svg>" alt="Аватар">
            </div>
            <div class="profile-name" id="userName">Загрузка...</div>
            <div class="profile-username" id="userUsername"></div>
            <div class="profile-level">Уровень <span id="profileLvl">1</span></div>
        </div>
    </div>

    <div class="page hidden" id="page-settings">
        <div class="tab-title">СИСТЕМА</div>
        <div class="placeholder-box">
            <div class="big">⬡</div>
            Настройки:<br>
            • Смена темы<br>
            • Звук<br>
            • Сброс прогресса<br><br>
            <button class="action-btn" style="margin-top:20px;" onclick="resetGame()">⬡ СБРОСИТЬ ПРОГРЕСС</button>
        </div>
    </div>

    <div class="bottom-nav" id="bottomNav">
        <button class="nav-item active" data-tab="home" onclick="switchTab('home', this)">
            <span class="icon">⬢</span><span>Главная</span>
        </button>
        <button class="nav-item" data-tab="quests" onclick="switchTab('quests', this)">
            <span class="icon">⬡</span><span>Квесты</span>
        </button>
        <button class="nav-item" data-tab="profile" onclick="switchTab('profile', this)">
            <span class="icon">⬡</span><span>Профиль</span>
        </button>
    </div>

    <script>
        let data = { level: 1, xp: 0, xpMax: 100 };
        let lastTab = 'home';

        // ===== ЗАГРУЗКА ДАННЫХ ИГРЫ =====
        function loadData() {
            const local = localStorage.getItem('rpgData');
            if (local) data = JSON.parse(local);
            if (window.Telegram && Telegram.WebApp) {
                Telegram.WebApp.ready();
                Telegram.WebApp.CloudStorage.getItem('rpgData', (err, value) => {
                    if (value) { data = JSON.parse(value); updateUI(); }
                });
            }
            updateUI();
        }

        // ===== ЗАГРУЗКА ДАННЫХ ИЗ TELEGRAM =====
        function loadTelegramUser() {
            // Проверяем, есть ли Telegram WebApp
            if (!window.Telegram || !Telegram.WebApp) {
                document.getElementById('userName').innerText = 'Гость';
                document.getElementById('userUsername').innerText = 'Откройте в Telegram';
                return;
            }

            // Инициализация
            Telegram.WebApp.ready();
            Telegram.WebApp.expand();

            // Пробуем получить данные
            const tryLoad = () => {
                const user = Telegram.WebApp.initDataUnsafe ? Telegram.WebApp.initDataUnsafe.user : null;
                
                if (user) {
                    // Имя
                    const fullName = (user.first_name || '') + (user.last_name ? ' ' + user.last_name : '');
                    document.getElementById('userName').innerText = fullName.trim() || 'Без имени';
                    
                    // Юзернейм
                    if (user.username) {
                        document.getElementById('userUsername').innerText = '@' + user.username;
                    } else {
                        document.getElementById('userUsername').innerText = '@нет_юзернейма';
                    }
                    
                    // Аватар
                    if (user.photo_url) {
                        document.getElementById('userAvatar').src = user.photo_url;
                    } else {
                        // Если фото нет — показываем первую букву имени
                        const firstLetter = (user.first_name || '?')[0].toUpperCase();
                        const svg = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='110' height='110'><rect width='110' height='110' fill='%230a1520'/><text x='50%' y='50%' font-size='50' fill='%2300ffff' text-anchor='middle' dominant-baseline='central'>" + firstLetter + "</text></svg>";
                        document.getElementById('userAvatar').src = svg;
                    }
                    return true;
                }
                return false;
            };

            // Пробуем сразу
            if (!tryLoad()) {
                // Если данных нет — пробуем ещё раз через 500мс и через 1.5с
                setTimeout(tryLoad, 500);
                setTimeout(tryLoad, 1500);
            }
        }

        function saveData() {
            const json = JSON.stringify(data);
            localStorage.setItem('rpgData', json);
            if (window.Telegram && Telegram.WebApp) {
                Telegram.WebApp.CloudStorage.setItem('rpgData', json);
            }
        }

        function updateUI() {
            document.getElementById('topLvl').innerText = data.level;
            document.getElementById('topXp').innerText = data.xp;
            document.getElementById('topXpMax').innerText = data.xpMax;
            document.getElementById('profileLvl').innerText = data.level;
        }

        function resetGame() {
            if (confirm("Сбросить весь прогресс?")) {
                data = { level: 1, xp: 0, xpMax: 100 };
                localStorage.removeItem('rpgData');
                if (window.Telegram && Telegram.WebApp) Telegram.WebApp.CloudStorage.removeItem('rpgData');
                updateUI();
            }
        }

        function toggleSettings() {
            const menuBtn = document.getElementById('menuBtn');
            const settingsPage = document.getElementById('page-settings');
            const isOpen = !settingsPage.classList.contains('hidden');

            if (isOpen) {
                menuBtn.classList.remove('open');
                const targetBtn = document.querySelector('.nav-item[data-tab="' + lastTab + '"]');
                switchTab(lastTab, targetBtn);
            } else {
                const activeNav = document.querySelector('.nav-item.active');
                lastTab = activeNav ? activeNav.getAttribute('data-tab') : 'home';
                menuBtn.classList.add('open');
                switchTab('settings', null);
            }
        }

        function switchTab(tabName, btn) {
            document.querySelectorAll('.page').forEach(p => p.classList.add('hidden'));
            document.getElementById('page-' + tabName).classList.remove('hidden');
            document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
            if (btn) btn.classList.add('active');
            if (tabName !== 'settings') {
                document.getElementById('menuBtn').classList.remove('open');
            }

            const levelBadge = document.getElementById('levelBadge');
            if (tabName === 'home') {
                levelBadge.classList.remove('hidden');
            } else {
                levelBadge.classList.add('hidden');
            }

            const bottomNav = document.getElementById('bottomNav');
            if (tabName === 'settings') {
                bottomNav.classList.add('hidden');
            } else {
                bottomNav.classList.remove('hidden');
            }

            updateIcons();
        }

        function updateIcons() {
            document.querySelectorAll('.nav-item').forEach(item => {
                const icon = item.querySelector('.icon');
                if (item.classList.contains('active')) {
                    icon.innerText = '⬢';
                } else {
                    icon.innerText = '⬡';
                }
            });
        }

        // Инициализация
        loadData();
        updateIcons();
        
        // Загружаем данные Telegram с небольшой задержкой (даём странице прогрузиться)
        window.addEventListener('load', () => {
            setTimeout(loadTelegramUser, 100);
        });
    </script>

</body>
</html>
