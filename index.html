<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RPG Жизнь</title>
    <style>
        * { box-sizing: border-box; }
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            overscroll-behavior: none;
            touch-action: manipulation;
        }
        body {
            font-family: 'Courier New', monospace;
            color: #7ad7ff;
            display: flex; flex-direction: column; align-items: center;
            user-select: none; background-color: #0a0a1a;
        }
        .grid-bg {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: -2; background-color: #0a0a1a;
            background-image: 
                linear-gradient(rgba(0, 255, 255, 0.08) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 255, 255, 0.08) 1px, transparent 1px);
            background-size: 22px 22px;
        }
        .grid-glow {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: -1;
            background: 
                radial-gradient(ellipse at 0% 0%, rgba(74, 168, 232, 0.12) 0%, transparent 50%),
                radial-gradient(ellipse at 100% 100%, rgba(155, 89, 182, 0.1) 0%, transparent 50%),
                radial-gradient(ellipse at 100% 0%, rgba(0, 255, 255, 0.06) 0%, transparent 50%);
        }

        .top-bar {
            position: fixed;
            top: 15px;
            left: 15px;
            right: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
            z-index: 9999;
            background: rgba(10, 10, 26, 0.85);
            backdrop-filter: blur(10px);
            padding: 0;
            border-radius: 4px;
        }
        .panel {
            background: rgba(15, 30, 55, 0.9);
            border: 1px solid #1e4a7a;
            border-radius: 4px;
            transition: all 0.2s;
            overflow: hidden;
            position: relative;
        }
        .panel:hover {
            border-color: #00ffff;
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.4);
        }
        .menu-btn {
            flex-shrink: 0; width: 48px; height: 48px;
            cursor: pointer; display: flex; flex-direction: column;
            align-items: center; justify-content: center; gap: 5px;
            padding: 0;
        }
        .menu-btn:active { transform: scale(0.95); }
        .menu-btn span {
            display: block; width: 22px; height: 2px; background: #7ad7ff;
            border-radius: 1px; transition: all 0.3s;
        }
        .menu-btn:hover span { background: #00ffff; box-shadow: 0 0 6px #00ffff; }
        .menu-btn.open span:nth-child(1) { transform: translateY(7px) rotate(45deg); }
        .menu-btn.open span:nth-child(2) { opacity: 0; }
        .menu-btn.open span:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }

        .badge {
            flex: 1; height: 48px;
            display: flex; align-items: center; justify-content: center;
            padding: 0 12px; gap: 6px;
        }
        .badge .label { font-size: 11px; color: #4a7a9a; text-transform: uppercase; letter-spacing: 1px; }
        .badge .value {
            font-size: 18px; font-weight: bold; color: #00ffff;
            text-shadow: 0 0 8px rgba(0, 255, 255, 0.7); letter-spacing: 1px;
        }
        .badge .xp-mini { font-size: 10px; color: #4a7a9a; }
        .badge.hidden { display: none; }

        .level-badge-wrap {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        .level-badge-wrap.hidden { display: none; }
        .level-badge-wrap .badge { width: 100%; }
        .xp-bar {
            width: 100%;
            height: 8px;
            background: rgba(10, 20, 40, 0.9);
            border: 1px solid #1e4a7a;
            border-radius: 4px;
            overflow: hidden;
            position: relative;
        }
        .xp-fill {
            height: 100%;
            background: linear-gradient(90deg, #0088ff, #00ffff);
            width: 0%;
            transition: width 0.4s ease;
            box-shadow: 0 0 10px #00ffff;
            border-radius: 3px;
        }

        .name-badge-clickable { cursor: pointer; }
        .name-badge-clickable:active { transform: scale(0.97); }

        /* ===== ОСНОВНОЙ КОНТЕНТ (С ПРОКРУТКОЙ) ===== */
        .page {
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 90px 20px 90px 20px;
            gap: 15px;
            overflow-y: auto;
            overflow-x: hidden;
            -webkit-overflow-scrolling: touch;
        }
        .page.hidden { display: none; }
        .page::-webkit-scrollbar { width: 4px; }
        .page::-webkit-scrollbar-thumb { background: #1e4a7a; border-radius: 2px; }
        .page::-webkit-scrollbar-track { background: transparent; }

        /* ===== ПЛАШКА-СЕКЦИЯ ===== */
        .quests-section {
            width: 100%; max-width: 340px;
            padding: 14px 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            backdrop-filter: blur(8px);
            flex-shrink: 0;
            cursor: pointer;
            user-select: none;
        }
        .quests-section:active { transform: scale(0.98); }
        .quests-section .label {
            font-size: 12px;
            color: #4a7a9a;
            text-transform: uppercase;
            letter-spacing: 2px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .quests-section .arrow {
            font-size: 12px;
            color: #00ffff;
            transition: transform 0.3s ease;
            display: inline-block;
        }
        .quests-section.collapsed .arrow {
            transform: rotate(-90deg);
        }
        .quests-section .value {
            font-size: 20px;
            font-weight: bold;
            color: #00ffff;
            text-shadow: 0 0 8px rgba(0, 255, 255, 0.7);
        }
        .quests-section .value.danger {
            color: #ff5588;
            text-shadow: 0 0 8px rgba(255, 85, 136, 0.7);
        }

        /* ===== СПИСКИ КВЕСТОВ ===== */
        .quests-list {
            width: 100%;
            max-width: 340px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            overflow: hidden;
            transition: max-height 0.4s ease, opacity 0.3s ease;
            max-height: none;
            opacity: 1;
            flex-shrink: 0;
        }
        .quests-list.collapsed {
            max-height: 0 !important;
            opacity: 0;
            pointer-events: none;
        }

        .card {
            width: 100%; max-width: 340px;
            padding: 25px 20px;
            text-align: center;
            backdrop-filter: blur(8px);
            flex-shrink: 0;
        }

        .stats-card {
            min-height: 60vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding-top: 25px;
            flex-shrink: 0;
        }

        .card-label {
            font-size: 12px; color: #4a7a9a; text-transform: uppercase;
            letter-spacing: 2px; margin-bottom: 10px;
        }

        .stats-title {
            font-size: 16px;
            color: #4a7a9a;
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-bottom: 25px;
        }

        .stats-row {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid #1e4a7a;
        }
        .stats-row:last-child { border-bottom: none; }
        .stats-row .label {
            font-size: 13px;
            color: #4a7a9a;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        .stats-row .value {
            font-size: 20px;
            font-weight: bold;
            color: #00ffff;
            text-shadow: 0 0 8px rgba(0, 255, 255, 0.7);
        }
        .stats-row .value.danger {
            color: #ff5588;
            text-shadow: 0 0 8px rgba(255, 85, 136, 0.7);
        }

        .quest-card {
            width: 100%; max-width: 340px;
            padding: 20px;
            text-align: left;
            backdrop-filter: blur(8px);
            display: flex;
            flex-direction: column;
            gap: 12px;
            flex-shrink: 0;
        }
        .quest-title {
            font-size: 16px;
            font-weight: bold;
            color: #00ffff;
            letter-spacing: 1px;
            text-shadow: 0 0 8px rgba(0, 255, 255, 0.5);
            margin-bottom: 5px;
        }
        .quest-desc {
            font-size: 12px;
            color: #4a7a9a;
            line-height: 1.6;
            margin-bottom: 12px;
        }
        .quest-reward {
            font-size: 13px;
            color: #ffcc00;
            text-shadow: 0 0 6px rgba(255, 204, 0, 0.5);
            margin-bottom: 6px;
        }
        .quest-penalty {
            font-size: 12px;
            color: #ff5588;
            text-shadow: 0 0 6px rgba(255, 85, 136, 0.5);
            margin-bottom: 12px;
        }
        .quest-btn {
            width: 100%;
            padding: 12px;
            background: rgba(15, 30, 55, 0.9);
            border: 1px solid #1e4a7a;
            color: #00ffff;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            font-weight: bold;
            letter-spacing: 2px;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.2s;
            border-radius: 4px;
        }
        .quest-btn:hover {
            border-color: #00ffff;
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.4);
        }
        .quest-btn:active { transform: scale(0.97); }
        .quest-btn.done {
            color: #4a7a9a;
            border-color: #1e4a7a;
            cursor: default;
        }
        .quest-btn.done:hover {
            border-color: #1e4a7a;
            box-shadow: none;
        }

        .quest-btn-refuse {
            border-color: #4a1a2a;
            color: #ff5588;
        }
        .quest-btn-refuse:hover {
            border-color: #ff0055;
            box-shadow: 0 0 15px rgba(255, 0, 85, 0.4);
        }

        .quest-card.failed {
            border-color: #4a1a2a;
            opacity: 0.7;
        }
        .quest-card.failed .quest-title {
            color: #ff5588;
            text-shadow: 0 0 8px rgba(255, 85, 136, 0.5);
        }

        .quest-card.done-card {
            border-color: #1e4a7a;
            opacity: 0.6;
        }
        .quest-card.done-card .quest-title {
            color: #4a7a9a;
            text-shadow: none;
        }

        .name-input {
            width: 100%; padding: 14px;
            background: rgba(10, 20, 40, 0.9);
            border: 1px solid #1e4a7a;
            color: #00ffff; font-family: 'Courier New', monospace;
            font-size: 18px; font-weight: bold; text-align: center;
            letter-spacing: 1px; outline: none; transition: all 0.2s;
            border-radius: 4px; margin-bottom: 12px;
        }
        .name-input:focus { border-color: #00ffff; box-shadow: 0 0 15px rgba(0, 255, 255, 0.5); }
        .name-input::placeholder { color: #3a5a7a; font-weight: normal; }

        .btn {
            padding: 14px;
            background: rgba(15, 30, 55, 0.9);
            border: 1px solid #1e4a7a;
            color: #00ffff;
            font-family: 'Courier New', monospace;
            font-size: 13px; font-weight: bold;
            letter-spacing: 2px; text-transform: uppercase;
            cursor: pointer; transition: all 0.2s;
            border-radius: 4px; width: 100%;
        }
        .btn:hover {
            border-color: #00ffff;
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.4);
        }
        .btn:active { transform: scale(0.97); }

        .btn-danger { border-color: #4a1a2a; color: #ff5588; }
        .btn-danger:hover { border-color: #ff0055; box-shadow: 0 0 15px rgba(255, 0, 85, 0.4); }

        .divider {
            width: 100%;
            height: 1px;
            background: #1e4a7a;
            margin: 20px 0;
        }

        .tab-title {
            font-size: 20px; text-transform: uppercase; letter-spacing: 3px;
            color: #00ffff; margin: 0 0 20px 0; text-align: center;
            text-shadow: 0 0 10px #00ffff;
        }
        .placeholder-box {
            width: 100%; max-width: 340px; padding: 30px 20px;
            background: rgba(15, 30, 55, 0.9);
            border: 1px dashed #1e4a7a;
            text-align: center; color: #4a7a9a; font-size: 14px; line-height: 1.7;
            border-radius: 4px; backdrop-filter: blur(8px);
        }
        .placeholder-box .big { font-size: 44px; margin-bottom: 12px; opacity: 0.7; }

        .empty-text {
            font-size: 12px;
            color: #3a5a7a;
            text-align: center;
            padding: 10px 0;
            letter-spacing: 1px;
        }

        .bottom-nav {
            position: fixed; bottom: 0; left: 0; right: 0; height: 68px;
            background: rgba(5, 10, 20, 0.97);
            border-top: 1px solid #1e4a7a;
            display: flex; justify-content: space-around; align-items: center;
            z-index: 99; backdrop-filter: blur(10px);
            box-shadow: 0 -5px 20px rgba(0, 255, 255, 0.1);
            transition: transform 0.3s ease, opacity 0.3s ease;
        }
        .bottom-nav.hidden { transform: translateY(100%); opacity: 0; pointer-events: none; }
        .nav-item {
            flex: 1; height: 100%; display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            background: transparent; border: none; color: #3a5a7a;
            font-family: 'Courier New', monospace; font-size: 10px;
            text-transform: uppercase; letter-spacing: 1px;
            cursor: pointer; transition: all 0.2s; gap: 4px; position: relative;
        }
        .nav-item .icon { font-size: 24px; line-height: 1; transition: all 0.2s; }
        .nav-item.active { color: #00ffff; text-shadow: 0 0 10px #00ffff; }
        .nav-item.active .icon { text-shadow: 0 0 12px #00ffff; }
        .nav-item.active::before {
            content: ''; position: absolute; top: 0; left: 25%; right: 25%;
            height: 2px; background: #00ffff; box-shadow: 0 0 10px #00ffff;
        }
        .nav-item:hover { color: #00ffff; }
    </style>
</head>
<body>

    <div class="grid-bg"></div>
    <div class="grid-glow"></div>

    <div class="top-bar">
        <button class="panel menu-btn" id="menuBtn" onclick="toggleSettings()">
            <span></span><span></span><span></span>
        </button>
        <div class="level-badge-wrap" id="levelBadge">
            <div class="panel badge">
                <span class="label">Уровень</span>
                <span class="value" id="topLvl">1</span>
                <span class="xp-mini">(<span id="topXp">0</span>/<span id="topXpMax">100</span>)</span>
            </div>
            <div class="xp-bar">
                <div class="xp-fill" id="topXpFill"></div>
            </div>
        </div>
        <div class="panel badge hidden name-badge-clickable" id="nameBadge" onclick="goToSettings()">
            <span class="label">Имя</span>
            <span class="value" id="topName">Гость</span>
        </div>
        <div class="panel badge hidden" id="questsBadge">
            <span class="value">КВЕСТЫ</span>
        </div>
    </div>

    <div class="page" id="page-home"></div>

    <div class="page hidden" id="page-quests">

        <div class="panel quests-section" id="sectionActive" onclick="toggleSection('active')">
            <span class="label">
                <span class="arrow">▼</span>
                Невыполненные
            </span>
            <span class="value" id="questsLeft">2</span>
        </div>
        <div class="quests-list" id="listActive"></div>

        <div class="panel quests-section" id="sectionDone" onclick="toggleSection('done')">
            <span class="label">
                <span class="arrow">▼</span>
                Выполненные
            </span>
            <span class="value" id="questsDoneCount">0</span>
        </div>
        <div class="quests-list" id="listDone"></div>

        <div class="panel quests-section" id="sectionFailed" onclick="toggleSection('failed')">
            <span class="label">
                <span class="arrow">▼</span>
                Проваленные
            </span>
            <span class="value danger" id="questsFailedCount">0</span>
        </div>
        <div class="quests-list" id="listFailed"></div>

    </div>

    <div class="page hidden" id="page-profile">
        <div class="panel card stats-card">
            <div class="stats-title">СТАТИСТИКА</div>
            <div class="stats-row">
                <span class="label">Уровень</span>
                <span class="value" id="profileLvl">1</span>
            </div>
            <div class="stats-row">
                <span class="label">Квестов выполнено</span>
                <span class="value" id="profileQuests">0</span>
            </div>
            <div class="stats-row">
                <span class="label">Квестов провалено</span>
                <span class="value danger" id="profileQuestsFailed">0</span>
            </div>
        </div>
    </div>

    <div class="page hidden" id="page-settings">
        <div class="tab-title">СИСТЕМА</div>
        <div class="panel card">
            <div class="card-label">Имя персонажа</div>
            <input 
                type="text" 
                class="name-input" 
                id="nameInput" 
                placeholder="Введите имя..." 
                maxlength="20"
                autocomplete="off"
            >
            <button class="btn" onclick="saveName()">Сохранить имя</button>

            <div class="divider"></div>

            <button class="btn btn-danger" onclick="resetGame()">⬡ СБРОСИТЬ ПРОГРЕСС</button>
        </div>
    </div>

    <div class="bottom-nav" id="bottomNav">
        <button class="nav-item active" data-tab="home" onclick="switchTab('home', this)">
            <span class="icon">⬢</span><span>Главная</span>
        </button>
        <button class="nav-item" data-tab="quests" onclick="switchTab('quests', this)">
            <span class="icon">⬡</span><span>Квесты</span>
        </button>
        <button class="nav-item" data-tab="profile" onclick="switchTab('profile', this)">
            <span class="icon">⬡</span><span>Профиль</span>
        </button>
    </div>

    <script>
        let data = { 
            level: 1, 
            xp: 0, 
            xpMax: 100, 
            name: 'Гость',
            questsDone: [],
            questsFailed: []
        };
        let lastTab = 'home';

        const quests = {
            1: { title: '🏋️ 20 отжиманий', desc: 'Сделай 20 отжиманий за сегодня.', reward: 100, penalty: 25 },
            2: { title: '📚 Прочитать 10 страниц', desc: 'Прочитай 10 страниц любой книги.', reward: 80, penalty: 20 }
        };

        function loadData() {
            const local = localStorage.getItem('rpgData');
            if (local) data = JSON.parse(local);
            if (!data.questsDone) data.questsDone = [];
            if (!data.questsFailed) data.questsFailed = [];
            if (data.name) {
                document.getElementById('nameInput').value = data.name;
                document.getElementById('topName').innerText = data.name;
            }
            updateUI();
            updateQuestsView();
        }

        function saveData() {
            const json = JSON.stringify(data);
            localStorage.setItem('rpgData', json);
            if (window.Telegram && Telegram.WebApp) {
                Telegram.WebApp.CloudStorage.setItem('rpgData', json);
            }
        }

        function saveName() {
            const nameValue = document.getElementById('nameInput').value.trim();
            if (nameValue === '') { alert('Введите имя!'); return; }
            data.name = nameValue;
            document.getElementById('topName').innerText = nameValue;
            saveData();
            alert('Имя сохранено: ' + nameValue);
        }

        function updateUI() {
            document.getElementById('topLvl').innerText = data.level;
            document.getElementById('topXp').innerText = data.xp;
            document.getElementById('topXpMax').innerText = data.xpMax;
            document.getElementById('profileLvl').innerText = data.level;
            document.getElementById('profileQuests').innerText = data.questsDone.length;
            document.getElementById('profileQuestsFailed').innerText = data.questsFailed.length;
            
            const percent = (data.xp / data.xpMax) * 100;
            document.getElementById('topXpFill').style.width = percent + '%';
            
            if (data.name) {
                document.getElementById('topName').innerText = data.name;
            }
        }

        function updateQuestsView() {
            const listActive = document.getElementById('listActive');
            const listDone = document.getElementById('listDone');
            const listFailed = document.getElementById('listFailed');

            listActive.innerHTML = '';
            listDone.innerHTML = '';
            listFailed.innerHTML = '';

            let activeCount = 0;
            Object.keys(quests).forEach(id => {
                const qid = parseInt(id);
                const isDone = data.questsDone.includes(qid);
                const isFailed = data.questsFailed.includes(qid);
                
                if (!isDone && !isFailed) {
                    activeCount++;
                    listActive.appendChild(createQuestCard(qid, 'active'));
                }
            });
            if (activeCount === 0) {
                const empty = document.createElement('div');
                empty.className = 'empty-text';
                empty.innerText = 'Все квесты разобраны';
                listActive.appendChild(empty);
            }
            document.getElementById('questsLeft').innerText = activeCount;

            if (data.questsDone.length === 0) {
                const empty = document.createElement('div');
                empty.className = 'empty-text';
                empty.innerText = 'Пока ничего не выполнено';
                listDone.appendChild(empty);
            } else {
                data.questsDone.forEach(qid => {
                    if (quests[qid]) listDone.appendChild(createQuestCard(qid, 'done'));
                });
            }
            document.getElementById('questsDoneCount').innerText = data.questsDone.length;

            if (data.questsFailed.length === 0) {
                const empty = document.createElement('div');
                empty.className = 'empty-text';
                empty.innerText = 'Пока ничего не провалено';
                listFailed.appendChild(empty);
            } else {
                data.questsFailed.forEach(qid => {
                    if (quests[qid]) listFailed.appendChild(createQuestCard(qid, 'failed'));
                });
            }
            document.getElementById('questsFailedCount').innerText = data.questsFailed.length;
        }

        function createQuestCard(questId, type) {
            const q = quests[questId];
            const card = document.createElement('div');
            card.className = 'panel quest-card';
            if (type === 'done') card.classList.add('done-card');
            if (type === 'failed') card.classList.add('failed');

            let buttonsHTML = '';
            if (type === 'active') {
                buttonsHTML = `
                    <button class="quest-btn" onclick="completeQuest(${questId})">Выполнить</button>
                    <button class="quest-btn quest-btn-refuse" onclick="refuseQuest(${questId})">Отказаться</button>
                `;
            } else if (type === 'done') {
                buttonsHTML = `<button class="quest-btn done" disabled>✓ ВЫПОЛНЕНО</button>`;
            } else if (type === 'failed') {
                buttonsHTML = `<button class="quest-btn quest-btn-refuse" disabled style="opacity:0.5; cursor:default;">✕ ПРОВАЛЕНО</button>`;
            }

            card.innerHTML = `
                <div>
                    <div class="quest-title">${q.title}</div>
                    <div class="quest-desc">${q.desc}</div>
                    <div class="quest-reward">Награда: +${q.reward} XP</div>
                    <div class="quest-penalty">Штраф за отказ: −${q.penalty} XP</div>
                </div>
                ${buttonsHTML}
            `;
            return card;
        }

        function toggleSection(name) {
            const section = document.getElementById('section' + capitalize(name));
            const list = document.getElementById('list' + capitalize(name));
            section.classList.toggle('collapsed');
            list.classList.toggle('collapsed');
        }

        function capitalize(str) {
            if (str === 'active') return 'Active';
            if (str === 'done') return 'Done';
            if (str === 'failed') return 'Failed';
            return str;
        }

        function completeQuest(questId) {
            if (data.questsDone.includes(questId)) {
                alert('Этот квест уже выполнен!');
                return;
            }
            if (data.questsFailed.includes(questId)) {
                alert('Вы отказались от этого квеста!');
                return;
            }
            if (!confirm('Квест выполнен?')) return;

            const reward = quests[questId].reward;
            data.questsDone.push(questId);
            data.xp += reward;

            if (data.xp >= data.xpMax) {
                data.level++;
                data.xp -= data.xpMax;
                data.xpMax = Math.floor(data.xpMax * 1.5);
                alert('🎉 Новый уровень! Теперь ты ' + data.level + ' уровня!');
            } else {
                alert('✅ Квест выполнен! +' + reward + ' XP');
            }

            updateUI();
            updateQuestsView();
            saveData();
        }

        function refuseQuest(questId) {
            if (data.questsDone.includes(questId)) {
                alert('Этот квест уже выполнен!');
                return;
            }
            if (data.questsFailed.includes(questId)) {
                alert('Вы уже отказались от этого квеста!');
                return;
            }
            const penalty = quests[questId].penalty;
            if (!confirm('Отказаться от квеста? Штраф: −' + penalty + ' XP')) return;

            data.questsFailed.push(questId);
            data.xp -= penalty;

            let leveledDown = false;
            while (data.xp < 0) {
                if (data.level > 1) {
                    data.level--;
                    data.xpMax = Math.floor(data.xpMax / 1.5);
                    data.xp += data.xpMax;
                    leveledDown = true;
                } else {
                    data.xp = 0;
                    break;
                }
            }

            if (leveledDown) {
                alert('❌ Квест провален. Штраф: −' + penalty + ' XP\n⚠️ Уровень понижен! Теперь ты ' + data.level + ' уровня.');
            } else {
                alert('❌ Квест провален. Штраф: −' + penalty + ' XP');
            }

            updateUI();
            updateQuestsView();
            saveData();
        }

        function resetGame() {
            if (confirm("Сбросить весь прогресс?")) {
                data = { level: 1, xp: 0, xpMax: 100, name: 'Гость', questsDone: [], questsFailed: [] };
                localStorage.removeItem('rpgData');
                if (window.Telegram && Telegram.WebApp) Telegram.WebApp.CloudStorage.removeItem('rpgData');
                document.getElementById('nameInput').value = '';
                document.getElementById('topName').innerText = 'Гость';
                updateUI();
                updateQuestsView();
            }
        }

        function goToSettings() {
            lastTab = 'profile';
            document.getElementById('menuBtn').classList.add('open');
            switchTab('settings', null);
        }

        function toggleSettings() {
            const menuBtn = document.getElementById('menuBtn');
            const settingsPage = document.getElementById('page-settings');
            const isOpen = !settingsPage.classList.contains('hidden');

            if (isOpen) {
                menuBtn.classList.remove('open');
                const targetBtn = document.querySelector('.nav-item[data-tab="' + lastTab + '"]');
                switchTab(lastTab, targetBtn);
            } else {
                const activeNav = document.querySelector('.nav-item.active');
                lastTab = activeNav ? activeNav.getAttribute('data-tab') : 'home';
                menuBtn.classList.add('open');
                switchTab('settings', null);
            }
        }

        function switchTab(tabName, btn) {
            document.querySelectorAll('.page').forEach(p => p.classList.add('hidden'));
            document.getElementById('page-' + tabName).classList.remove('hidden');
            document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
            if (btn) btn.classList.add('active');
            if (tabName !== 'settings') {
                document.getElementById('menuBtn').classList.remove('open');
            }

            const levelBadge = document.getElementById('levelBadge');
            const nameBadge = document.getElementById('nameBadge');
            const questsBadge = document.getElementById('questsBadge');

            if (tabName === 'home') {
                levelBadge.classList.remove('hidden');
            } else {
                levelBadge.classList.add('hidden');
            }

            if (tabName === 'profile') {
                nameBadge.classList.remove('hidden');
            } else {
                nameBadge.classList.add('hidden');
            }

            if (tabName === 'quests') {
                questsBadge.classList.remove('hidden');
            } else {
                questsBadge.classList.add('hidden');
            }

            const bottomNav = document.getElementById('bottomNav');
            if (tabName === 'settings') {
                bottomNav.classList.add('hidden');
            } else {
                bottomNav.classList.remove('hidden');
            }

            updateIcons();
            
            // Прокрутка вверх при переключении вкладки
            const currentPage = document.getElementById('page-' + tabName);
            if (currentPage) currentPage.scrollTop = 0;
        }

        function updateIcons() {
            document.querySelectorAll('.nav-item').forEach(item => {
                const icon = item.querySelector('.icon');
                if (item.classList.contains('active')) {
                    icon.innerText = '⬢';
                } else {
                    icon.innerText = '⬡';
                }
            });
        }

        loadData();
        updateIcons();
    </script>

</body>
</html>
