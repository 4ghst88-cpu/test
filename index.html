<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RPG Жизнь</title>
    <style>
        * { box-sizing: border-box; }
        html, body {
            height: 100%; overflow: hidden; position: fixed; width: 100%;
            margin: 0; padding: 0; overscroll-behavior: none; touch-action: manipulation;
        }
        body {
            font-family: 'Courier New', monospace;
            color: #7ad7ff;
            display: flex; flex-direction: column; align-items: center;
            user-select: none; background-color: #0a0a1a;
        }
        .grid-bg {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: -2; background-color: #0a0a1a;
            background-image: 
                linear-gradient(rgba(0, 255, 255, 0.08) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 255, 255, 0.08) 1px, transparent 1px);
            background-size: 22px 22px;
        }
        .grid-glow {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: -1;
            background: 
                radial-gradient(ellipse at 0% 0%, rgba(74, 168, 232, 0.12) 0%, transparent 50%),
                radial-gradient(ellipse at 100% 100%, rgba(155, 89, 182, 0.1) 0%, transparent 50%),
                radial-gradient(ellipse at 100% 0%, rgba(0, 255, 255, 0.06) 0%, transparent 50%);
        }

        /* ===== ВЕРХНЯЯ ПАНЕЛЬ ===== */
        .top-bar {
            position: fixed; top: 15px; left: 15px; right: 15px;
            display: flex; align-items: center; gap: 10px; z-index: 100;
        }

        .panel {
            background: rgba(15, 30, 55, 0.9);
            border: 1px solid #1e4a7a;
            border-radius: 4px;
            transition: all 0.2s;
            overflow: hidden;
            position: relative;
        }
        .panel:hover {
            border-color: #00ffff;
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.4);
        }

        .menu-btn {
            flex-shrink: 0; width: 48px; height: 48px;
            cursor: pointer; display: flex; flex-direction: column;
            align-items: center; justify-content: center; gap: 5px;
            padding: 0;
        }
        .menu-btn:active { transform: scale(0.95); }
        .menu-btn span {
            display: block; width: 22px; height: 2px; background: #7ad7ff;
            border-radius: 1px; transition: all 0.3s;
        }
        .menu-btn:hover span { background: #00ffff; box-shadow: 0 0 6px #00ffff; }
        .menu-btn.open span:nth-child(1) { transform: translateY(7px) rotate(45deg); }
        .menu-btn.open span:nth-child(2) { opacity: 0; }
        .menu-btn.open span:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }

        /* Плашки (уровень, имя, квесты) */
        .badge {
            flex: 1; height: 48px;
            display: flex; align-items: center; justify-content: center;
            padding: 0 12px; gap: 6px;
        }
        .badge .label { font-size: 11px; color: #4a7a9a; text-transform: uppercase; letter-spacing: 1px; }
        .badge .value {
            font-size: 18px; font-weight: bold; color: #00ffff;
            text-shadow: 0 0 8px rgba(0, 255, 255, 0.7); letter-spacing: 1px;
        }
        .badge .xp-mini { font-size: 10px; color: #4a7a9a; }
        .badge.hidden { display: none; }

        .name-badge-clickable {
            cursor: pointer;
        }
        .name-badge-clickable:active {
            transform: scale(0.97);
        }

        /* ===== ОСНОВНОЙ КОНТЕНТ ===== */
        .page {
            width: 100%; height: 100%; display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            padding: 80px 20px 80px 20px; overflow: hidden;
        }
        .page.hidden { display: none; }

        .card {
            width: 100%; max-width: 340px;
            padding: 25px 20px;
            text-align: center;
            backdrop-filter: blur(8px);
        }

        .stats-card {
            height: 60vh;
            max-height: 550px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .card-label {
            font-size: 12px; color: #4a7a9a; text-transform: uppercase;
            letter-spacing: 2px; margin-bottom: 10px;
        }

        .stats-title {
            font-size: 16px;
            color: #4a7a9a;
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-bottom: 20px;
        }

        .stats-empty {
            font-size: 13px;
            color: #3a5a7a;
            letter-spacing: 1px;
            line-height: 1.8;
        }

        .name-input {
            width: 100%; padding: 14px;
            background: rgba(10, 20, 40, 0.9);
            border: 1px solid #1e4a7a;
            color: #00ffff; font-family: 'Courier New', monospace;
            font-size: 18px; font-weight: bold; text-align: center;
            letter-spacing: 1px; outline: none; transition: all 0.2s;
            border-radius: 4px; margin-bottom: 12px;
        }
        .name-input:focus { border-color: #00ffff; box-shadow: 0 0 15px rgba(0, 255, 255, 0.5); }
        .name-input::placeholder { color: #3a5a7a; font-weight: normal; }

        .btn {
            padding: 14px;
            background: rgba(15, 30, 55, 0.9);
            border: 1px solid #1e4a7a;
            color: #00ffff;
            font-family: 'Courier New', monospace;
            font-size: 13px; font-weight: bold;
            letter-spacing: 2px; text-transform: uppercase;
            cursor: pointer; transition: all 0.2s;
            border-radius: 4px; width: 100%;
        }
        .btn:hover {
            border-color: #00ffff;
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.4);
        }
        .btn:active { transform: scale(0.97); }

        .btn-danger { border-color: #4a1a2a; color: #ff5588; }
        .btn-danger:hover { border-color: #ff0055; box-shadow: 0 0 15px rgba(255, 0, 85, 0.4); }

        .divider {
            width: 100%;
            height: 1px;
            background: #1e4a7a;
            margin: 20px 0;
        }

        .tab-title {
            font-size: 20px; text-transform: uppercase; letter-spacing: 3px;
            color: #00ffff; margin: 0 0 20px 0; text-align: center;
            text-shadow: 0 0 10px #00ffff;
        }
        .placeholder-box {
            width: 100%; max-width: 340px; padding: 30px 20px;
            background: rgba(15, 30, 55, 0.9);
            border: 1px dashed #1e4a7a;
            text-align: center; color: #4a7a9a; font-size: 14px; line-height: 1.7;
            border-radius: 4px; backdrop-filter: blur(8px);
        }
        .placeholder-box .big { font-size: 44px; margin-bottom: 12px; opacity: 0.7; }

        /* ===== НИЖНЯЯ ПАНЕЛЬ ===== */
        .bottom-nav {
            position: fixed; bottom: 0; left: 0; right: 0; height: 68px;
            background: rgba(5, 10, 20, 0.97);
            border-top: 1px solid #1e4a7a;
            display: flex; justify-content: space-around; align-items: center;
            z-index: 99; backdrop-filter: blur(10px);
            box-shadow: 0 -5px 20px rgba(0, 255, 255, 0.1);
            transition: transform 0.3s ease, opacity 0.3s ease;
        }
        .bottom-nav.hidden { transform: translateY(100%); opacity: 0; pointer-events: none; }
        .nav-item {
            flex: 1; height: 100%; display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            background: transparent; border: none; color: #3a5a7a;
            font-family: 'Courier New', monospace; font-size: 10px;
            text-transform: uppercase; letter-spacing: 1px;
            cursor: pointer; transition: all 0.2s; gap: 4px; position: relative;
        }
        .nav-item .icon { font-size: 24px; line-height: 1; transition: all 0.2s; }
        .nav-item.active { color: #00ffff; text-shadow: 0 0 10px #00ffff; }
        .nav-item.active .icon { text-shadow: 0 0 12px #00ffff; }
        .nav-item.active::before {
            content: ''; position: absolute; top: 0; left: 25%; right: 25%;
            height: 2px; background: #00ffff; box-shadow: 0 0 10px #00ffff;
        }
        .nav-item:hover { color: #00ffff; }
    </style>
</head>
<body>

    <div class="grid-bg"></div>
    <div class="grid-glow"></div>

    <!-- ===== ВЕРХНЯЯ ПАНЕЛЬ ===== -->
    <div class="top-bar">
        <button class="panel menu-btn" id="menuBtn" onclick="toggleSettings()">
            <span></span><span></span><span></span>
        </button>
        <!-- Плашка уровня (главная) -->
        <div class="panel badge" id="levelBadge">
            <span class="label">Уровень</span>
            <span class="value" id="topLvl">1</span>
            <span class="xp-mini">(<span id="topXp">0</span>/<span id="topXpMax">100</span>)</span>
        </div>
        <!-- Плашка имени (профиль) -->
        <div class="panel badge hidden name-badge-clickable" id="nameBadge" onclick="goToSettings()">
            <span class="label">Имя</span>
            <span class="value" id="topName">Гость</span>
        </div>
        <!-- Плашка квестов (квесты) -->
        <div class="panel badge hidden" id="questsBadge">
            <span class="value">КВЕСТЫ</span>
        </div>
    </div>

    <!-- ===== ГЛАВНАЯ ===== -->
    <div class="page" id="page-home"></div>

    <!-- ===== КВЕСТЫ ===== -->
    <div class="page hidden" id="page-quests">
        <div class="placeholder-box">
            <div class="big">⬡</div>
            Здесь появятся ежедневные задания:<br>
            • 20 отжиманий<br>
            • Прочитать 10 страниц<br>
            • Убрать комнату<br><br>
            Награда — опыт
        </div>
    </div>

    <!-- ===== ПРОФИЛЬ ===== -->
    <div class="page hidden" id="page-profile">
        <div class="panel card stats-card">
            <div class="stats-title">СТАТИСТИКА</div>
            <div class="stats-empty">
                Пока пусто...<br>
                Скоро здесь появятся показатели
            </div>
        </div>
    </div>

    <!-- ===== СИСТЕМА ===== -->
    <div class="page hidden" id="page-settings">
        <div class="tab-title">СИСТЕМА</div>
        <div class="panel card">
            <div class="card-label">Имя персонажа</div>
            <input 
                type="text" 
                class="name-input" 
                id="nameInput" 
                placeholder="Введите имя..." 
                maxlength="20"
                autocomplete="off"
            >
            <button class="btn" onclick="saveName()">Сохранить имя</button>

            <div class="divider"></div>

            <button class="btn btn-danger" onclick="resetGame()">⬡ СБРОСИТЬ ПРОГРЕСС</button>
        </div>
    </div>

    <!-- ===== НИЖНЯЯ НАВИГАЦИЯ ===== -->
    <div class="bottom-nav" id="bottomNav">
        <button class="nav-item active" data-tab="home" onclick="switchTab('home', this)">
            <span class="icon">⬢</span><span>Главная</span>
        </button>
        <button class="nav-item" data-tab="quests" onclick="switchTab('quests', this)">
            <span class="icon">⬡</span><span>Квесты</span>
        </button>
        <button class="nav-item" data-tab="profile" onclick="switchTab('profile', this)">
            <span class="icon">⬡</span><span>Профиль</span>
        </button>
    </div>

    <script>
        let data = { level: 1, xp: 0, xpMax: 100, name: 'Гость' };
        let lastTab = 'home';

        function loadData() {
            const local = localStorage.getItem('rpgData');
            if (local) data = JSON.parse(local);
            if (data.name) {
                document.getElementById('nameInput').value = data.name;
                document.getElementById('topName').innerText = data.name;
            }
            updateUI();
        }

        function saveData() {
            const json = JSON.stringify(data);
            localStorage.setItem('rpgData', json);
            if (window.Telegram && Telegram.WebApp) {
                Telegram.WebApp.CloudStorage.setItem('rpgData', json);
            }
        }

        function saveName() {
            const nameValue = document.getElementById('nameInput').value.trim();
            if (nameValue === '') {
                alert('Введите имя!');
                return;
            }
            data.name = nameValue;
            document.getElementById('topName').innerText = nameValue;
            saveData();
            alert('Имя сохранено: ' + nameValue);
        }

        function updateUI() {
            document.getElementById('topLvl').innerText = data.level;
            document.getElementById('topXp').innerText = data.xp;
            document.getElementById('topXpMax').innerText = data.xpMax;
            if (data.name) {
                document.getElementById('topName').innerText = data.name;
            }
        }

        function resetGame() {
            if (confirm("Сбросить весь прогресс?")) {
                data = { level: 1, xp: 0, xpMax: 100, name: 'Гость' };
                localStorage.removeItem('rpgData');
                if (window.Telegram && Telegram.WebApp) Telegram.WebApp.CloudStorage.removeItem('rpgData');
                document.getElementById('nameInput').value = '';
                document.getElementById('topName').innerText = 'Гость';
                updateUI();
            }
        }

        function goToSettings() {
            lastTab = 'profile';
            document.getElementById('menuBtn').classList.add('open');
            switchTab('settings', null);
        }

        function toggleSettings() {
            const menuBtn = document.getElementById('menuBtn');
            const settingsPage = document.getElementById('page-settings');
            const isOpen = !settingsPage.classList.contains('hidden');

            if (isOpen) {
                menuBtn.classList.remove('open');
                const targetBtn = document.querySelector('.nav-item[data-tab="' + lastTab + '"]');
                switchTab(lastTab, targetBtn);
            } else {
                const activeNav = document.querySelector('.nav-item.active');
                lastTab = activeNav ? activeNav.getAttribute('data-tab') : 'home';
                menuBtn.classList.add('open');
                switchTab('settings', null);
            }
        }

        function switchTab(tabName, btn) {
            document.querySelectorAll('.page').forEach(p => p.classList.add('hidden'));
            document.getElementById('page-' + tabName).classList.remove('hidden');
            document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
            if (btn) btn.classList.add('active');
            if (tabName !== 'settings') {
                document.getElementById('menuBtn').classList.remove('open');
            }

            const levelBadge = document.getElementById('levelBadge');
            const nameBadge = document.getElementById('nameBadge');
            const questsBadge = document.getElementById('questsBadge');

            // Уровень — только на главной
            if (tabName === 'home') {
                levelBadge.classList.remove('hidden');
            } else {
                levelBadge.classList.add('hidden');
            }

            // Имя — только в профиле
            if (tabName === 'profile') {
                nameBadge.classList.remove('hidden');
            } else {
                nameBadge.classList.add('hidden');
            }

            // Квесты — только на вкладке квестов
            if (tabName === 'quests') {
                questsBadge.classList.remove('hidden');
            } else {
                questsBadge.classList.add('hidden');
            }

            const bottomNav = document.getElementById('bottomNav');
            if (tabName === 'settings') {
                bottomNav.classList.add('hidden');
            } else {
                bottomNav.classList.remove('hidden');
            }

            updateIcons();
        }

        function updateIcons() {
            document.querySelectorAll('.nav-item').forEach(item => {
                const icon = item.querySelector('.icon');
                if (item.classList.contains('active')) {
                    icon.innerText = '⬢';
                } else {
                    icon.innerText = '⬡';
                }
            });
        }

        loadData();
        updateIcons();
    </script>

</body>
</html>
