<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RPG Жизнь</title>
    <style>
        body {
            font-family: 'Courier New', monospace;
            color: #7ad7ff;
            margin: 0;
            padding: 0 0 80px 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            user-select: none;
            background: #050810;
            overflow-x: hidden;
        }

        /* ===== ФОН: НОЧНОЙ КИБЕРПАНК-ГОРОД ===== */
        .city-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
            overflow: hidden;
            background: linear-gradient(180deg, #0a0e1a 0%, #0f1729 40%, #0a1520 70%, #050810 100%);
        }

        /* Здания на заднем плане */
        .city-buildings {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 65%;
            background-image: 
                /* Дальние здания */
                linear-gradient(to top, #050810 0%, transparent 100%),
                repeating-linear-gradient(90deg, 
                    #0a1220 0px, #0a1220 40px, 
                    transparent 40px, transparent 45px,
                    #0d1628 45px, #0d1628 80px, 
                    transparent 80px, transparent 85px,
                    #081020 85px, #081020 130px, 
                    transparent 130px, transparent 135px,
                    #0a1424 135px, #0a1424 170px,
                    transparent 170px, transparent 175px
                );
            background-size: 100% 100%, 100% 100%;
            opacity: 0.9;
        }

        /* Окна в зданиях (светящиеся точки) */
        .city-windows {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 65%;
            background-image: 
                radial-gradient(2px 2px at 50px 60%, #4aa8e8, transparent),
                radial-gradient(2px 2px at 50px 70%, #7ad7ff, transparent),
                radial-gradient(2px 2px at 50px 80%, #4aa8e8, transparent),
                radial-gradient(2px 2px at 90px 65%, #7ad7ff, transparent),
                radial-gradient(2px 2px at 90px 75%, #4aa8e8, transparent),
                radial-gradient(2px 2px at 150px 55%, #7ad7ff, transparent),
                radial-gradient(2px 2px at 150px 70%, #4aa8e8, transparent),
                radial-gradient(2px 2px at 210px 60%, #7ad7ff, transparent),
                radial-gradient(2px 2px at 210px 80%, #4aa8e8, transparent),
                radial-gradient(2px 2px at 270px 68%, #7ad7ff, transparent),
                radial-gradient(2px 2px at 330px 58%, #4aa8e8, transparent),
                radial-gradient(2px 2px at 330px 78%, #7ad7ff, transparent),
                radial-gradient(2px 2px at 30px 85%, #4aa8e8, transparent),
                radial-gradient(2px 2px at 180px 88%, #7ad7ff, transparent),
                radial-gradient(2px 2px at 300px 88%, #4aa8e8, transparent);
            background-size: 400px 100%;
            background-repeat: repeat-x;
            animation: window-flicker 4s infinite;
            opacity: 0.7;
        }

        @keyframes window-flicker {
            0%, 100% { opacity: 0.7; }
            50% { opacity: 0.5; }
        }

        /* Туман / дымка снизу */
        .city-fog {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 40%;
            background: linear-gradient(to top, rgba(10, 15, 30, 0.95) 0%, transparent 100%);
            pointer-events: none;
        }

        /* Свечение от города (неоновая дымка) */
        .city-glow {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 50%;
            background: 
                radial-gradient(ellipse at 30% 100%, rgba(74, 168, 232, 0.15) 0%, transparent 60%),
                radial-gradient(ellipse at 70% 100%, rgba(155, 89, 182, 0.1) 0%, transparent 60%);
            pointer-events: none;
        }

        /* ===== КНОПКА МЕНЮ ===== */
        .menu-btn {
            position: fixed;
            top: 15px;
            left: 15px;
            width: 44px;
            height: 44px;
            background: rgba(15, 30, 55, 0.9);
            border: 1px solid #1e4a7a;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 5px;
            transition: all 0.2s;
            z-index: 100;
            border-radius: 4px;
            padding: 0;
        }
        .menu-btn:hover {
            border-color: #4aa8e8;
            box-shadow: 0 0 12px rgba(74, 168, 232, 0.3);
        }
        .menu-btn:active { transform: scale(0.95); }
        .menu-btn span {
            display: block;
            width: 22px;
            height: 2px;
            background: #7ad7ff;
            border-radius: 1px;
            transition: all 0.3s;
        }
        .menu-btn.open span:nth-child(1) { transform: translateY(7px) rotate(45deg); }
        .menu-btn.open span:nth-child(2) { opacity: 0; }
        .menu-btn.open span:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }

        /* ===== ОСНОВНОЙ КОНТЕНТ ===== */
        .page {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 70px;
        }
        .page.hidden { display: none; }

        .level-box {
            background: rgba(10, 20, 40, 0.8);
            border: 1px solid #1e4a7a;
            box-shadow: 0 0 20px rgba(30, 120, 200, 0.3), inset 0 0 20px rgba(30, 120, 200, 0.1);
            padding: 18px;
            width: 100%;
            max-width: 340px;
            text-align: center;
            margin-bottom: 25px;
            border-radius: 4px;
            backdrop-filter: blur(8px);
        }
        .level {
            font-size: 18px;
            color: #7ad7ff;
            font-weight: bold;
            letter-spacing: 2px;
            text-transform: uppercase;
            text-shadow: 0 0 10px rgba(74, 168, 232, 0.5);
        }
        .xp-text {
            font-size: 13px;
            color: #4a7a9a;
            margin-top: 5px;
        }
        .xp-bar {
            width: 100%;
            height: 10px;
            background: #0a1520;
            border: 1px solid #1e4a7a;
            overflow: hidden;
            margin-top: 10px;
            border-radius: 5px;
        }
        .xp-fill {
            height: 100%;
            background: linear-gradient(90deg, #1e6bb8, #4aa8e8, #7ad7ff);
            width: 0%;
            transition: width 0.4s;
            border-radius: 5px;
            box-shadow: 0 0 10px #4aa8e8;
        }

        /* ===== ПРОФИЛЬ ===== */
        .profile-card {
            width: 100%;
            max-width: 340px;
            background: rgba(10, 20, 40, 0.85);
            border: 1px solid #1e4a7a;
            border-radius: 4px;
            padding: 25px 20px;
            text-align: center;
            backdrop-filter: blur(8px);
            box-shadow: 0 0 20px rgba(30, 120, 200, 0.3);
        }
        .avatar-wrapper {
            width: 110px;
            height: 110px;
            margin: 0 auto 18px;
            border-radius: 50%;
            padding: 3px;
            background: linear-gradient(135deg, #1e6bb8, #4aa8e8);
            box-shadow: 0 0 25px rgba(74, 168, 232, 0.6);
        }
        .avatar {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            background: #0a1520;
            display: block;
        }
        .profile-name {
            font-size: 22px;
            font-weight: bold;
            color: #7ad7ff;
            letter-spacing: 1px;
            margin-bottom: 5px;
            text-shadow: 0 0 12px rgba(74, 168, 232, 0.6);
        }
        .profile-username {
            font-size: 13px;
            color: #4a7a9a;
            margin-bottom: 20px;
        }
        .profile-level {
            display: inline-block;
            padding: 8px 20px;
            background: rgba(30, 107, 184, 0.3);
            border: 1px solid #1e4a7a;
            border-radius: 4px;
            font-size: 14px;
            color: #7ad7ff;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .tab-title {
            font-size: 20px;
            text-transform: uppercase;
            letter-spacing: 3px;
            color: #7ad7ff;
            margin: 20px 0 25px;
            text-align: center;
            text-shadow: 0 0 10px rgba(74, 168, 232, 0.5);
        }
        .placeholder-box {
            width: 100%;
            max-width: 340px;
            padding: 35px 20px;
            background: rgba(10, 20, 40, 0.75);
            border: 1px dashed #1e4a7a;
            text-align: center;
            color: #4a7a9a;
            font-size: 14px;
            line-height: 1.7;
            border-radius: 4px;
            backdrop-filter: blur(8px);
        }
        .placeholder-box .big {
            font-size: 44px;
            margin-bottom: 12px;
            opacity: 0.7;
        }
        .action-btn {
            padding: 16px;
            border: 1px solid #1e4a7a;
            background: rgba(10, 20, 40, 0.8);
            color: #7ad7ff;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            font-weight: bold;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.2s;
            border-radius: 4px;
            backdrop-filter: blur(8px);
        }
        .action-btn:hover {
            background: rgba(20, 50, 90, 0.9);
            border-color: #4aa8e8;
            box-shadow: 0 0 12px rgba(74, 168, 232, 0.25);
        }
        .btn-sport { border-left: 3px solid #e94560; }

        /* ===== НИЖНЯЯ ПАНЕЛЬ ===== */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 68px;
            background: rgba(5, 10, 20, 0.97);
            border-top: 1px solid #1e4a7a;
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 99;
            backdrop-filter: blur(10px);
        }
        .nav-item {
            flex: 1;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: transparent;
            border: none;
            color: #3a5a7a;
            font-family: 'Courier New', monospace;
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.2s;
            gap: 4px;
            position: relative;
        }
        .nav-item .icon { font-size: 20px; }
        .nav-item.active { color: #7ad7ff; }
        .nav-item.active::before {
            content: '';
            position: absolute;
            top: 0;
            left: 25%;
            right: 25%;
            height: 2px;
            background: #4aa8e8;
            box-shadow: 0 0 8px #4aa8e8;
        }
        .nav-item:hover { color: #7ad7ff; }
    </style>
</head>
<body>

    <!-- ФОН: НОЧНОЙ ГОРОД -->
    <div class="city-bg">
        <div class="city-glow"></div>
        <div class="city-buildings"></div>
        <div class="city-windows"></div>
        <div class="city-fog"></div>
    </div>

    <!-- КНОПКА МЕНЮ -->
    <button class="menu-btn" id="menuBtn" onclick="toggleSettings()">
        <span></span>
        <span></span>
        <span></span>
    </button>

    <!-- ===== ГЛАВНАЯ ===== -->
    <div class="page" id="page-home">
        <div class="level-box">
            <div class="level">Уровень <span id="lvl">1</span></div>
            <div class="xp-text">Опыт: <span id="xp">0</span> / <span id="xpMax">100</span></div>
            <div class="xp-bar"><div class="xp-fill" id="xpFill"></div></div>
        </div>
    </div>

    <!-- ===== КВЕСТЫ ===== -->
    <div class="page hidden" id="page-quests">
        <div class="tab-title">📜 Квесты</div>
        <div class="placeholder-box">
            <div class="big">📜</div>
            Здесь появятся ежедневные задания:<br>
            • 20 отжиманий<br>
            • Прочитать 10 страниц<br>
            • Убрать комнату<br><br>
            Награда — опыт
        </div>
    </div>

    <!-- ===== ПРОФИЛЬ ===== -->
    <div class="page hidden" id="page-profile">
        <div class="profile-card">
            <div class="avatar-wrapper">
                <img class="avatar" id="userAvatar" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='110' height='110'><rect width='110' height='110' fill='%230a1520'/><text x='50%' y='50%' font-size='40' fill='%234a7a9a' text-anchor='middle' dominant-baseline='central'>?</text></svg>" alt="Аватар">
            </div>
            <div class="profile-name" id="userName">Гость</div>
            <div class="profile-username" id="userUsername">@неизвестно</div>
            <div class="profile-level">Уровень <span id="profileLvl">1</span></div>
        </div>
    </div>

    <!-- ===== СИСТЕМА ===== -->
    <div class="page hidden" id="page-settings">
        <div class="tab-title">⚙️ Система</div>
        <div class="placeholder-box">
            <div class="big">⚙️</div>
            Настройки:<br>
            • Смена темы<br>
            • Звук<br>
            • Сброс прогресса<br><br>
            <button class="action-btn btn-sport" style="margin-top:20px; width:100%;" onclick="resetGame()">🗑️ СБРОСИТЬ ПРОГРЕСС</button>
        </div>
    </div>

    <!-- ===== НИЖНЯЯ НАВИГАЦИЯ ===== -->
    <div class="bottom-nav">
        <button class="nav-item active" data-tab="home" onclick="switchTab('home', this)">
            <span class="icon">⚡</span>
            <span>Главная</span>
        </button>
        <button class="nav-item" data-tab="quests" onclick="switchTab('quests', this)">
            <span class="icon">📜</span>
            <span>Квесты</span>
        </button>
        <button class="nav-item" data-tab="profile" onclick="switchTab('profile', this)">
            <span class="icon">👤</span>
            <span>Профиль</span>
        </button>
    </div>

    <script>
        let data = {
            level: 1, xp: 0, xpMax: 100
        };

        let lastTab = 'home';

        function loadData() {
            const local = localStorage.getItem('rpgData');
            if (local) data = JSON.parse(local);
            if (window.Telegram && Telegram.WebApp) {
                Telegram.WebApp.ready();
                Telegram.WebApp.CloudStorage.getItem('rpgData', (err, value) => {
                    if (value) { data = JSON.parse(value); updateUI(); }
                });
            }
            updateUI();
            loadTelegramUser();
        }

        function loadTelegramUser() {
            if (window.Telegram && Telegram.WebApp && Telegram.WebApp.initDataUnsafe) {
                const user = Telegram.WebApp.initDataUnsafe.user;
                if (user) {
                    const fullName = (user.first_name || '') + (user.last_name ? ' ' + user.last_name : '');
                    document.getElementById('userName').innerText = fullName || 'Гость';
                    document.getElementById('userUsername').innerText = user.username ? '@' + user.username : '@без_юзернейма';
                    if (user.photo_url) {
                        document.getElementById('userAvatar').src = user.photo_url;
                    }
                }
            }
        }

        function saveData() {
            const json = JSON.stringify(data);
            localStorage.setItem('rpgData', json);
            if (window.Telegram && Telegram.WebApp) {
                Telegram.WebApp.CloudStorage.setItem('rpgData', json);
            }
        }

        function updateUI() {
            document.getElementById('lvl').innerText = data.level;
            document.getElementById('xp').innerText = data.xp;
            document.getElementById('xpMax').innerText = data.xpMax;
            document.getElementById('xpFill').style.width = (data.xp / data.xpMax) * 100 + '%';
            document.getElementById('profileLvl').innerText = data.level;
        }

        function resetGame() {
            if (confirm("Сбросить весь прогресс?")) {
                data = { level: 1, xp: 0, xpMax: 100 };
                localStorage.removeItem('rpgData');
                if (window.Telegram && Telegram.WebApp) Telegram.WebApp.CloudStorage.removeItem('rpgData');
                updateUI();
            }
        }

        function toggleSettings() {
            const menuBtn = document.getElementById('menuBtn');
            const settingsPage = document.getElementById('page-settings');
            const isOpen = !settingsPage.classList.contains('hidden');

            if (isOpen) {
                menuBtn.classList.remove('open');
                const targetBtn = document.querySelector('.nav-item[data-tab="' + lastTab + '"]');
                switchTab(lastTab, targetBtn);
            } else {
                const activeNav = document.querySelector('.nav-item.active');
                lastTab = activeNav ? activeNav.getAttribute('data-tab') : 'home';
                menuBtn.classList.add('open');
                switchTab('settings', null);
            }
        }

        function switchTab(tabName, btn) {
            document.querySelectorAll('.page').forEach(p => p.classList.add('hidden'));
            document.getElementById('page-' + tabName).classList.remove('hidden');
            document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
            if (btn) btn.classList.add('active');
            if (tabName !== 'settings') {
                document.getElementById('menuBtn').classList.remove('open');
            }
            window.scrollTo(0, 0);
        }

        loadData();
    </script>

</body>
</html>
